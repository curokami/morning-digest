name: Morning Digest
on:
  workflow_dispatch:
  schedule:
    - cron: "40 22 * * *" # 07:40 JST (previous UTC day)
jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: cp config.yaml.example config.yaml
      - name: Restore processing state
        uses: actions/cache@v4
        with:
          path: data/processed_articles.json
          key: morning-digest-state-${{ github.run_id }}
          restore-keys: morning-digest-state-
      - run: uv run morning-digest --config config.yaml
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
